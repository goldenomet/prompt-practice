<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin review · Prompt Practice</title>
<style>
:root{--ink:#1d302b;--muted:#64736d;--paper:#f4f6f1;--card:#fff;--line:#e4e9e2;--green:#226b53;--green2:#e5f2e9;--yellow:#fbf3d9;--shadow:0 16px 42px #233e2610}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}.shell{max-width:1120px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0 22px}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.mark{background:var(--green);color:white;width:34px;height:34px;border-radius:11px;display:grid;place-items:center}.studentlink{color:var(--green);font-weight:700;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;margin:35px 0;box-shadow:var(--shadow)}.kicker{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}h1{font-size:32px;letter-spacing:-1px;margin:5px 0}.muted{color:var(--muted);font-size:13px}.form{max-width:430px;margin-top:24px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input{border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 17px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:11px}.btn.secondary{background:#eef2eb;color:var(--ink)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:28px}.toolbar .btn{margin:0}.toolbar div{display:flex;gap:8px}table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}details{min-width:120px}summary{cursor:pointer;color:var(--green);font-weight:700}.result{font-size:12px;color:var(--muted)}.error{color:#a43e32;min-height:1.5em}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:38px}.pill{display:inline-block;background:var(--green2);padding:3px 8px;border-radius:20px;font-size:12px;font-weight:700}@media(max-width:700px){.shell{padding:14px}.card{padding:20px}.toolbar{align-items:flex-start;flex-direction:column}.scroll{overflow:auto}table{font-size:11px}th,td{padding:8px 5px}}
</style></head>
<body><div class="shell"><header class="topbar"><div class="brand"><span class="mark">✳</span> Prompt Practice <span class="muted">/ Admin review</span></div><a class="studentlink" href="/">Student course ↗</a></header>
<main class="card"><div class="kicker">Private course administration</div><h1>Learner submissions</h1><div class="muted">Review scores, course progress, and quiz responses.</div>
<section id="login" class="form"><div class="field"><label for="key">Admin access key</label><input id="key" type="password" autocomplete="current-password" placeholder="Enter your admin key"></div><button class="btn" id="open">Open review inbox</button><div class="error" id="error" role="status"></div><div class="muted">Access is checked by the course server.</div></section>
<section id="inbox" class="hidden"><div class="toolbar"><span class="muted" id="count"></span><div><button class="btn secondary" id="refresh">Refresh</button><button class="btn secondary" id="export">Export CSV</button></div></div><div class="scroll"><table><thead><tr><th>Learner</th><th>Email</th><th>Score</th><th>Lessons</th><th>Submitted</th><th>Quiz review</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main></div>
<script>
const questions=['What is a prompt best described as in this course?','Which sequence matches the five-part prompt checklist?','Why can a vague prompt lead to a convincing but false answer?','What should a prompt request when report information is missing?','How should you verify an AI-generated report?','When may sensitive information be uploaded to an AI tool?','What is the “think” rule asking you to do?','When should you disclose that you used AI?','Who has ultimate responsibility for work produced with AI assistance?','Which item must an AI never invent in a high-risk project report?'];
let records=[];const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const key=$('key').value;try{const r=await fetch('/api/submissions',{headers:{'X-Admin-Key':key}});if(!r.ok)throw Error(r.status===401?'That key was not accepted.':'Could not load submissions. Check the course server.');records=await r.json();$('error').textContent='';$('login').classList.add('hidden');$('inbox').classList.remove('hidden');$('count').textContent=`${records.length} submission${records.length===1?'':'s'}`;$('rows').innerHTML=records.length?records.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td><span class="pill">${x.score}/${x.total}</span></td><td>${x.lessonsCompleted}/3</td><td>${new Date(x.completedAt).toLocaleString()}</td><td><details><summary>Answers</summary>${questions.map((q,i)=>`<div class="result">Q${i+1}: ${x.answers?.[i]===answerKey[i]?'Correct':'Incorrect'}</div>`).join('')}</details></td></tr>`).join(''):`<tr><td class="empty" colspan="6">No learner submissions yet.</td></tr>`}catch(e){$('error').textContent=e.message}}
const answerKey=[0,0,0,1,0,1,1,0,1,1];$('open').onclick=load;$('key').onkeydown=e=>{if(e.key==='Enter')load()};$('refresh').onclick=load;$('export').onclick=()=>{const rows=[['Name','Email','Score','Total','Lessons completed','Completed at',...questions.map((_,i)=>`Q${i+1}`)],...records.map(r=>[r.name,r.email,r.score,r.total,r.lessonsCompleted,r.completedAt,...questions.map((_,i)=>r.answers?.[i]===answerKey[i]?'Correct':'Incorrect')])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='prompt-practice-submissions.csv';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
